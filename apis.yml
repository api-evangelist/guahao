name: guahao
description: >-
  guahao.com is the flagship consumer domain of WeDoctor (微医), the Chinese
  digital-health platform that began as Guahao.com (挂号网) — literally the
  "appointment-registration network" — connecting patients to hospitals and
  physicians for online appointment booking, telemedicine consultations,
  e-prescriptions, and chronic-disease management. Founded in Hangzhou around
  2010 and among the early investments of Qiming Venture Partners, the company
  operates a large internet-hospital and clinic network across China. This
  API Evangelist profile was surfaced from a venture-portfolio lead and enriched
  by the pipeline; the public site sits behind a bot-challenge WAF (Tencent
  EdgeOne infrastructure), so no public developer/API surface was discoverable
  in this pass — the captured artifact is a live domain-security probe.
